services:
  bhashabridge-ai-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhashabridge-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./app.py:/app/app.py
    environment:
      - MODELS_DIR=/app/models
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

